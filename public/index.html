<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>アドレス帳</title>
  </head>
  <body>
    <h1>アドレス帳</h1>

    <!-- 連絡先一覧 -->
    <section>
      <h2>連絡先一覧</h2>
      <ul id="contact-list"></ul>
    </section>
    <!-- 連絡先登録フォーム -->
    <section>
      <h2>連絡先を登録する</h2>
      <form id="contact-form">
        <div>
          <label>名前（必須）：<input type="text" id="name" required /></label>
        </div>
        <div>
          <label>メール：<input type="email" id="email" /></label>
        </div>
        <div>
          <label>電話番号：<input type="tel" id="phone" /></label>
        </div>
        <button type="submit">登録する</button>
      </form>
    </section>
    <!-- 連絡先編集フォーム（初期状態では非表示） -->
    <section id="edit-section" style="display: none">
      <h2>連絡先を編集する</h2>
      <form id="edit-form">
        <input type="hidden" id="edit-id" />
        <div>
          <label
            >名前（必須）：<input type="text" id="edit-name" required
          /></label>
        </div>
        <div>
          <label>メール：<input type="email" id="edit-email" /></label>
        </div>
        <div>
          <label>電話番号：<input type="tel" id="edit-phone" /></label>
        </div>
        <button type="submit">更新する</button>
        <button type="button" id="cancel-edit">キャンセル</button>
      </form>
    </section>

    <script src="app.js"></script>
  </body>
</html>
